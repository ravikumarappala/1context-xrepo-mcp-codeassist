openapi: 3.1.0
info: { title: inventory-service, version: 1.0.0 }
paths:
  /stock/{sku}:
    get:
      summary: Available quantity for a SKU
      responses:
        "200": { description: "{ sku, available }" }
        "404": { description: unknown sku }
    post:
      summary: Reserve stock for an order
      requestBody: { content: { application/json: { schema: { type: object, properties: { quantity: { type: integer, minimum: 1 } } } } } }
      responses:
        "200": { description: "{ sku, reserved, available }" }
        "409": { description: not enough stock }
